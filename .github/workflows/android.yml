name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Décompresser le projet
        run: |
          mkdir app && unzip -q "$(ls *.zip | head -1)" -d app
          sed -i 's|^import installPageTemplate from .*|const installPageTemplate = "";|' app/server/middleware/grok-pwa.ts
          grep -n installPageTemplate app/server/middleware/grok-pwa.ts | head -3
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Installer
        working-directory: app
        run: npm install
      - name: Build web (SPA)
        working-directory: app
        env: { ANDROID_BUILD: "1" }
        run: |
          PATH="$PWD/node_modules/.bin:$PATH" node scripts/with-app-env.mjs vite build
          [ -f .output/public/index.html ] || { [ -f .output/public/_shell.html ] && cp .output/public/_shell.html .output/public/index.html; }
          find .output -maxdepth 2 -not -path '*/assets/*'
          test -f .output/public/index.html
      - name: Projet Android
        working-directory: app
        run: |
          npx cap add android
          npx cap sync android
      - name: Compiler l'APK
        working-directory: app/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NORD-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
